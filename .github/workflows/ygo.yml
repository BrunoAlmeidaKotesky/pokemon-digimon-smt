name: Atualizar cartas de Yu-Gi-Oh

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Quantos monstros (os mais vistos primeiro)
        default: '3000'
  push:
    paths:
      - scripts/ygo.mjs
      - .github/workflows/ygo.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/ygo.mjs
        env:
          YGO_LIMIT: ${{ inputs.limit || '3000' }}
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ygo
          git diff --cached --quiet || git commit -m "Atualiza cartas de Yu-Gi-Oh"
          git push
