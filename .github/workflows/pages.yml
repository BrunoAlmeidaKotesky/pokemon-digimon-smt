# Checa e publica o site no GitHub Pages.
# Push na main: typecheck, lint, Vitest, build e publicação (o Playwright já rodou na react).
# Push na react (ou PR): só as checagens, sem publicar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, react]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Playwright roda na react e nos PRs; na main o mesmo código já passou por ele, então o deploy pula (mais rápido)
      - name: Playwright (Chromium)
        if: github.ref != 'refs/heads/main'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-falhas
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
